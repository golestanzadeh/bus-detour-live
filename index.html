<!DOCTYPE html>
<html lang="de">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bus Detour Live Report</title>

  <style>
    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow: 0 10px 30px -5px rgba(15,23,42,.06);
      --brand:#2563eb;

      --chipBg:#0f172a;
      --chipText:#ffffff;

      --routeBg:#f8fafc;
      --routeBorder:#f1f5f9;

      --stopRed:#dc2626;
      --ersatzGreen:#16a34a;

      --dateBoxBg:#f0fdf4;
      --dateBoxBorder:#bbf7d0;
      --dateColor:#065f46;
      --timeColor:#dc2626;
    }

    *{ box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin:0;
      padding: 0 12px 24px;
    }

    .sticky-header{
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 16px 0 12px;
      z-index: 100;
      max-width: 900px;
      margin: 0 auto;
      backdrop-filter: blur(8px);
    }

    .wrap{ max-width: 900px; margin: 0 auto; }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .search{
      flex:1;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 16px;
      display:flex;
      gap:10px;
      align-items:center;
      box-shadow: 0 4px 12px rgba(15,23,42,.03);
      transition: all 0.2s ease;
    }

    .search:focus-within{
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .search input{
      border:0;
      outline:none;
      width:100%;
      font-size:16px;
      background:transparent;
      color:var(--text);
      min-width:0;
    }

    .btn{
      border:1px solid var(--border);
      background:#fff;
      border-radius:14px;
      padding:12px 18px;
      font-weight:800;
      font-size:16px;
      color:var(--text);
      box-shadow: 0 4px 12px rgba(15,23,42,.03);
      white-space:nowrap;
      cursor:pointer;
      transition: all 0.2s ease;
    }

    .btn:hover{
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .grid{ display:grid; gap:16px; margin-top: 8px; }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover{
      box-shadow: 0 14px 35px -5px rgba(15,23,42,.1);
    }

    /* نوار وضعیت هوشمند دینامیک در سمت چپ کارت */
    .card::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:6px;
      background: var(--stripe-color, #2563eb);
    }

    .cardInner{ padding:18px 20px; }

    .location{
      font-size:20px;
      font-weight:900;
      color: var(--brand);
      margin: 0 0 14px;
      line-height: 1.2;
      word-break: break-word;
    }

    .kv{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:10px 14px;
      font-size:16px;
      line-height: 1.4;
      align-items: center;
    }

    .label{
      font-weight:800;
      color: #334155;
      white-space:nowrap;
    }

    .label.stop{ color: var(--stopRed); }
    .label.ersatz{ color: var(--ersatzGreen); }

    .value{
      font-weight:600;
      word-break: break-word;
    }

    .chips{ display:flex; gap:6px; flex-wrap:wrap; }
    .chip{
      background: var(--chipBg);
      color: var(--chipText);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .2px;
    }

    .dateBox{
      background: var(--dateBoxBg);
      border: 1px solid var(--dateBoxBorder);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .dateGrid{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:8px 14px;
      font-size:16px;
      align-items:center;
    }

    .dt{
      display:inline-flex;
      gap:10px;
      align-items:baseline;
      flex-wrap:wrap;
    }

    .dtDate{
      color: var(--dateColor);
      font-weight: 800;
    }

    .dtTime{
      color: var(--timeColor);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .routeBox{
      margin-top:14px;
      background: var(--routeBg);
      border: 1px solid var(--routeBorder);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
    }
    .routeTitle{ font-weight: 800; margin-bottom: 4px; color: #475569; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }

    .actions{ margin-top:16px; display:flex; gap:12px; align-items:center; }
    .pdfBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 16px;
      border-radius:12px;
      border: 1px solid #bfdbfe;
      font-weight:800;
      font-size:16px;
      color: var(--brand);
      text-decoration:none;
      background: #eff6ff;
      transition: background 0.2s ease;
    }
    .pdfBtn:hover{
      background: #dbeafe;
    }
    .hint{ color: var(--muted); font-size: 13px; font-weight: 700; }

    .empty{
      background:#fff;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 30px 20px;
      text-align:center;
      color: var(--muted);
      font-weight: 800;
      font-size: 16px;
      margin-top: 20px;
    }

    @media(max-width:520px){
      .kv, .dateGrid{ grid-template-columns: 110px 1fr; font-size: 15px; }
      .location{ font-size: 18px; }
    }
  </style>
</head>

<body>

  <div class="sticky-header">
    <div class="wrap">
      <div class="controls">
        <div class="search">
          <span>🔍</span> <input id="q" placeholder="Suchen: Ort, Linien, Straßen, Hinweise …" />
        </div>
        <button class="btn" onclick="reload()">Aktualisieren</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="container" class="grid"></div>
  </div>

<script>
let ALL = [];

function esc(s){
  if(s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function norm(v){
  const s = String(v ?? "").trim();
  if(!s) return "none";
  if(s.toLowerCase() === "n/a") return "none";
  return s;
}

function linesChips(lines){
  const s0 = String(lines ?? "").trim();
  const s = norm(s0);
  if(s === "none") return "none";
  const parts = s.split(",").map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return "none";
  return `<div class="chips">${parts.map(p=>`<span class="chip">${esc(p)}</span>`).join("")}</div>`;
}

function fmtDT(dateStr, timeStr){
  return `<span class="dt">
    <span class="dtDate">${esc(norm(dateStr))}</span>
    <span class="dtTime">${esc(norm(timeStr))}</span>
  </span>`;
}

// تابع تشخیص رنگ وضعیت هوشمند بر اساس تاریخ (امروز، آینده، گذشته)
function getStatusColor(startDate, endDate) {
  const today = "2026-08-16"; // تاریخ جاری سیستم
  const start = String(startDate || "").trim();
  const end = String(endDate || "").trim();

  if (start === today || (start <= today && end >= today)) {
    return "#16a34a"; // سبز: فعال امروز
  } else if (start > today) {
    return "#2563eb"; // آبی: آینده
  } else {
    return "#94a3b8"; // خاکستری: گذشته
  }
}

function card(r){
  const ort = norm(r.location);
  const startDT = fmtDT(r.startDate, r.startTime);
  const endDT   = fmtDT(r.endDate, r.endTime);
  const strassen = norm(r.streets);
  const haltestellen = norm(r.busStops);
  const ersatz = norm(r.ersatzStops);
  const umleitung = norm(r.detour);
  const hinweise = norm(r.hinweise);

  const stripeColor = getStatusColor(r.startDate, r.endDate);

  const pdf = String(r.pdf || "").trim();
  const pdfHtml = pdf
    ? `<a class="pdfBtn" href="${esc(pdf)}" target="_blank" rel="noopener">📄 PDF öffnen</a>`
    : `<span class="hint">📄 PDF: none</span>`;

  return `
    <div class="card" style="--stripe-color: ${stripeColor};">
      <div class="cardInner">
        <div class="location">${esc(ort)}</div>

        <div class="dateBox">
          <div class="dateGrid">
            <div class="label">Start</div><div class="value">${startDT}</div>
            <div class="label">Ende</div><div class="value">${endDT}</div>
          </div>
        </div>

        <div class="kv">
          <div class="label">Linien</div><div class="value">${linesChips(r.lines)}</div>
          <div class="label">Straßen</div><div class="value">${esc(strassen)}</div>
          <div class="label stop">Haltestellen</div><div class="value">${esc(haltestellen)}</div>
          <div class="label ersatz">Ersatz-Hst</div><div class="value">${esc(ersatz)}</div>
        </div>

        <div class="routeBox">
          <div class="routeTitle">Umleitung</div>
          ${esc(umleitung)}
        </div>

        <div class="routeBox">
          <div class="routeTitle">Hinweise</div>
          ${esc(hinweise)}
        </div>

        <div class="actions">
          ${pdfHtml}
        </div>
      </div>
    </div>
  `;
}

function render(rows){
  ALL = rows || [];
  const c = document.getElementById("container");
  if(!ALL.length){
    c.innerHTML = `<div class="empty">Keine aktiven Einträge gefunden.</div>`;
    return;
  }
  c.innerHTML = ALL.map(card).join("");
  bindSearch();
}

function bindSearch(){
  const q = document.getElementById("q");
  q.oninput = () => {
    const term = (q.value || "").toLowerCase().trim();
    const c = document.getElementById("container");

    if(!term){
      c.innerHTML = ALL.map(card).join("");
      return;
    }

    const filtered = ALL.filter(r => {
      const blob = [
        r.location, r.startDate, r.startTime, r.endDate, r.endTime,
        r.lines, r.streets, r.busStops, r.ersatzStops, r.detour, r.hinweise
      ].join(" ").toLowerCase();
      return blob.includes(term);
    });

    c.innerHTML = filtered.length ? filtered.map(card).join("") : `<div class="empty">Keine Treffer gefunden.</div>`;
  };
}

const API_URL = "https://script.google.com/macros/s/AKfycbyec2ii-B4Zedff0f8xjUtgAwl5tyV68CN2-Q3gBTClnkxy2gxpGWoQvx-p1RhaIZbq9Q/exec";

function reload() {
  const container = document.getElementById("container");
  container.innerHTML = `<div class="empty">Lade Daten aus der Datenbank...</div>`;

  fetch(API_URL)
    .then(response => response.json())
    .then(data => {
      render(data); 
    })
    .catch(error => {
      console.error("Error fetching data:", error);
      container.innerHTML = `<div class="empty">Fehler beim Laden der Daten.</div>`;
    });
}

window.addEventListener("DOMContentLoaded", reload);
</script>
</body>
</html>
